# AdaHCL on Proprietary Dataset (student)
# Best hyperparameters from grid search

# Optimization
lr: 1.0e-3
lr_decay: 0.98
lr_min: 5.0e-4
batch: 4096
tstBat: 256
reg: 1.0e-5
epoch: 20

# Model architecture
latdim: 128
gnn_layer: 2
hyperNum: 128
topk: 20

# Data
data: student

# Loss weights
ssl_reg: 0.1
ib_reg: 1.0e-2
triple_reg: 1.0e-6
margin: 1.0

# Contrastive learning
temp: 0.5
tstEpoch: 1

# Denoising / L0
lambda0: 1.0e-4
gamma: -0.45
zeta: 1.05
init_temperature: 2.0
temperature_decay: 0.98
eps: 1.0e-3

# Environment
gpu: 0
seed: 2026
